# =====================================================================
# DataSource Oracle
# =====================================================================
# Côté APPLICATION, seule la propriété datasource.jndi est lue par Spring
# (voir application-springbean.xml) : JBoss gère la connexion et le pool.
#
# Les autres propriétés décrivent la datasource côté SERVEUR JBoss
# (mêmes noms que les attributs du sous-système "datasources" de JBoss :
# driver-name, connection-url, min-pool-size, max-pool-size, user-name/password).
# Elles servent à créer/vérifier la datasource dans JBoss (CLI, script de déploiement,
# équipe d'exploitation), ou à l'alternative B "pool géré par l'application".
#
# VALEURS PAR ENVIRONNEMENT (voir README § 6) :
#  - le même EAR est déployé partout ; datasource.jndi est en général identique partout ;
#  - URL, login, mot de passe et pool sont propres à chaque JBoss (dev, recette, prod) ;
#  - les valeurs ci-dessous sont des exemples / un gabarit, renseigné par environnement
#    selon le mécanisme déjà en place pour les autres propriétés du projet ;
#  - toute clé peut être surchargée sur un serveur par une propriété système JVM,
#    prioritaire sur ce fichier : -Ddatasource.jndi=... (les variables d'environnement ne marchent PAS).
# =====================================================================

# Nom JNDI sous lequel JBoss expose la datasource (ex. java:jboss/datasources/MonAppliDS)
datasource.jndi=java:jboss/datasources/MonAppliDS

datasource.driver-type=thin
datasource.driver-name=oracle
datasource.connection-url=jdbc:oracle:thin:@//hote-oracle:1521/SERVICE
datasource.min-pool-size=5
datasource.max-pool-size=20
datasource.security-login=MON_USER
# Mot de passe chiffré/protégé (vault JBoss, security-domain...) : ne jamais le mettre en clair dans Git
datasource.security-password-secured=
