# =====================================================================
# DataSource Oracle : AUCUNE clé ici, c'est voulu.
# =====================================================================
# La seule propriété lue par l'application, datasource.jndi (nom JNDI de la datasource,
# ex. java:jboss/datasources/MonAppliDS), est fournie par CHAQUE serveur JBoss sous forme de
# propriété système JVM : <system-properties> du standalone.xml, ou fichier chargé au démarrage
# par "standalone.sh -P ...". Spring la résout automatiquement (voir README § 6.3).
#
# URL, login, mot de passe et taille du pool sont dans la définition de la datasource côté
# JBoss (standalone.xml) : l'application ne les lit jamais (README § 6.2 et § 6.4).
#
# Ne pas ajouter de clé datasource.* dans ce fichier : elle ferait doublon avec le serveur,
# et un mot de passe n'a rien à faire dans le livrable.
# =====================================================================
